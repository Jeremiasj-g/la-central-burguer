name: QA Cuentas de clientes

on:
  push:
    branches:
      - feat/customer-accounts-dev-20261120
  pull_request:
    paths:
      - 'src/features/clientes/**'
      - 'tests/clientes/**'
      - 'src/app/api/orders/route.ts'
      - '.github/workflows/customer-accounts-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  customers:
    name: Clientes · QA automático
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar todas las pruebas
        run: npm test
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: ESLint del módulo de clientes
        run: npm run lint:clientes
      - name: Publicar resultado de QA
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'QA Clientes',
              description: '${{ job.status }}' === 'success' ? 'Pruebas, TypeScript y lint aprobados' : 'Revisar logs de GitHub Actions',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
